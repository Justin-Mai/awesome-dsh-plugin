url: https://github.com/Justin-Mai/dsh-stock-view
name: Justin-Mai/dsh-stock-view
category: fun
description:
  en: Watchlist panel in the DSH Web UI top-right corner. Tracks A-share, ETF, Hong Kong and US symbols plus crypto pairs, with intraday and daily/weekly/monthly K-line charts, buy/sell target prices, and group management with drag-to-reorder, delete and rename. Fork of dsh-stock-watch that drops its hover prompt menu and adds US stocks (Eastmoney) and crypto (OKX spot).
  zh: DeepSeek Harness 网页界面右上角的自选盯盘面板：同时监控 A股 / ETF / 港股 / 美股 与加密货币，支持分时、日周月 K 线、买卖目标价，以及可拖动排序 / 删除 / 重命名的分组管理。改造自 dsh-stock-watch：移除其悬浮提示词菜单，新增美股（东方财富）与加密货币（OKX 现货）。
